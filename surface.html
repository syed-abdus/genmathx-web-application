<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Math Surface - FINAL</title>

<style>
body { margin:0; overflow:hidden; background:black; }

#panel {
 position:absolute;
 top:15px;
 left:15px;
 background:rgba(0,0,0,0.7);
 padding:15px;
 border-radius:10px;
 color:white;
 width:260px;
}

input, button {
 width:100%;
 margin-top:6px;
 padding:6px;
 border-radius:6px;
 border:none;
}
button { background:#00ffff; cursor:pointer; }
</style>
</head>

<body>

<div id="panel">
<label>z = f(x,y,t)</label>
<input id="func" value="Math.sin(Math.sqrt(x*x+y*y)-t)">

<label>Resolution</label>
<input type="range" id="res" min="30" max="120" value="70">

<label>Speed</label>
<input type="range" id="speed" min="0" max="0.2" step="0.01" value="0.05">

<label>Amplitude</label>
<input type="range" id="amp" min="1" max="8" value="3">

<button onclick="createSurface()">Update</button>
</div>

<!-- ✅ IMPORTANT: use NON-module versions -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>

let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,20,40);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ✅ CONTROLS FIXED
let controls = new THREE.OrbitControls(camera, renderer.domElement);

// LIGHT
let light = new THREE.PointLight(0xffffff,1);
light.position.set(20,20,20);
scene.add(light);

scene.add(new THREE.AmbientLight(0x404040));

let mesh;
let t = 0;

// FUNCTION
function f(x,y){
 try {
  return Function("x","y","t","return "+document.getElementById("func").value)(x,y,t);
 } catch {
  return 0;
 }
}

// COLOR
function getColor(z){
 let r = 0.5 + z/5;
 let g = 0.3 + z/6;
 let b = 1 - z/5;
 return new THREE.Color(r,g,b);
}

// CREATE SURFACE
function createSurface(){

 if(mesh) scene.remove(mesh);

 let res = parseInt(document.getElementById("res").value);
 let amp = parseFloat(document.getElementById("amp").value);

 let geometry = new THREE.PlaneGeometry(30,30,res,res);

 let colors = [];

 for(let i=0;i<geometry.attributes.position.count;i++){

  let x = geometry.attributes.position.getX(i);
  let y = geometry.attributes.position.getY(i);

  let z = f(x,y)*amp;

  geometry.attributes.position.setZ(i,z);

  let c = getColor(z);
  colors.push(c.r,c.g,c.b);
 }

 geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
 geometry.computeVertexNormals();

 let material = new THREE.MeshStandardMaterial({
  vertexColors:true,
  side:THREE.DoubleSide
 });

 mesh = new THREE.Mesh(geometry, material);
 scene.add(mesh);
}

// ANIMATE
function animate(){
 requestAnimationFrame(animate);

 t += parseFloat(document.getElementById("speed").value);

 if(mesh){

  let amp = parseFloat(document.getElementById("amp").value);

  for(let i=0;i<mesh.geometry.attributes.position.count;i++){

   let x = mesh.geometry.attributes.position.getX(i);
   let y = mesh.geometry.attributes.position.getY(i);

   let z = f(x,y)*amp;

   mesh.geometry.attributes.position.setZ(i,z);

   let c = getColor(z);
   mesh.geometry.attributes.color.setXYZ(i,c.r,c.g,c.b);
  }

  mesh.geometry.attributes.position.needsUpdate = true;
  mesh.geometry.attributes.color.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
 }

 controls.update();
 renderer.render(scene,camera);
}

createSurface();
animate();

</script>

</body>
</html>
