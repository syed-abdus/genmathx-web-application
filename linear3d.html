<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Linear Algebra Engine</title>

<style>
body { margin:0; overflow:hidden; background:black; color:white; font-family:sans-serif; }

#panel {
 position:absolute;
 top:15px;
 left:15px;
 background:rgba(0,0,0,0.7);
 padding:15px;
 border-radius:10px;
 width:260px;
}

input {
 width:100%;
 margin-top:5px;
}
button {
 width:100%;
 margin-top:8px;
 padding:6px;
 background:#00ffff;
 border:none;
 cursor:pointer;
}
</style>
</head>

<body>

<div id="panel">
<h3>3x3 Matrix</h3>

<input id="m11" value="1"><input id="m12" value="0"><input id="m13" value="0">
<input id="m21" value="0"><input id="m22" value="1"><input id="m23" value="0">
<input id="m31" value="0"><input id="m32" value="0"><input id="m33" value="1">

<h3>Vector</h3>
<input id="vx" value="3">
<input id="vy" value="2">
<input id="vz" value="1">

<button onclick="toggleAnim()">Start / Stop Animation</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>

let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(5,5,10);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new THREE.OrbitControls(camera, renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0x404040));
let light = new THREE.PointLight(0xffffff,1);
light.position.set(10,10,10);
scene.add(light);

// AXES
function createAxis(color, dir){
 let material = new THREE.LineBasicMaterial({color:color});
 let points = [];
 points.push(new THREE.Vector3(0,0,0));
 points.push(dir);
 let geometry = new THREE.BufferGeometry().setFromPoints(points);
 return new THREE.Line(geometry, material);
}

scene.add(createAxis(0xff0000, new THREE.Vector3(5,0,0))); // X
scene.add(createAxis(0x00ff00, new THREE.Vector3(0,5,0))); // Y
scene.add(createAxis(0x0000ff, new THREE.Vector3(0,0,5))); // Z

// GRID
let grid = new THREE.GridHelper(20,20);
scene.add(grid);

let vectorMesh;

// MATRIX
function getMatrix(){
 return [
  [parseFloat(m11.value), parseFloat(m12.value), parseFloat(m13.value)],
  [parseFloat(m21.value), parseFloat(m22.value), parseFloat(m23.value)],
  [parseFloat(m31.value), parseFloat(m32.value), parseFloat(m33.value)]
 ];
}

// TRANSFORM
function transform(v){
 let m = getMatrix();
 return [
  m[0][0]*v[0] + m[0][1]*v[1] + m[0][2]*v[2],
  m[1][0]*v[0] + m[1][1]*v[1] + m[1][2]*v[2],
  m[2][0]*v[0] + m[2][1]*v[1] + m[2][2]*v[2]
 ];
}

// DRAW VECTOR
function drawVector(){

 if(vectorMesh) scene.remove(vectorMesh);

 let v = [
  parseFloat(vx.value),
  parseFloat(vy.value),
  parseFloat(vz.value)
 ];

 let t = transform(v);

 let material = new THREE.LineBasicMaterial({color:0x00ffff});
 let points = [];
 points.push(new THREE.Vector3(0,0,0));
 points.push(new THREE.Vector3(t[0], t[1], t[2]));

 let geometry = new THREE.BufferGeometry().setFromPoints(points);
 vectorMesh = new THREE.Line(geometry, material);

 scene.add(vectorMesh);
}

let anim = false;

// ANIMATION LOOP
function animate(){
 requestAnimationFrame(animate);

 if(anim){
  m12.value = parseFloat(m12.value) + 0.01;
  m21.value = parseFloat(m21.value) - 0.01;
 }

 drawVector();

 controls.update();
 renderer.render(scene,camera);
}

// TOGGLE
function toggleAnim(){
 anim = !anim;
}

animate();

</script>

</body>
</html>
