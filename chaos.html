<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chaos & Dynamical Systems Lab</title>
<style>
body{margin:0; background:#050505; font-family:'Inter',sans-serif; color:white; text-align:center;}
h1{margin:20px; font-size:50px; background:linear-gradient(90deg,#00aaff,#bb66ff,#ffd700); -webkit-background-clip:text; color:transparent;}
.controls{display:flex; justify-content:center; flex-wrap:wrap; margin:15px;}
label, input{margin:5px;}
input[type=range]{width:120px;}
button{padding:8px 12px; border:none; border-radius:10px; cursor:pointer; background:linear-gradient(90deg,#00aaff,#bb66ff); color:white; transition:0.3s;}
button:hover{transform:scale(1.05);}
canvas{display:block; margin:0 auto; border-radius:15px; box-shadow:0 0 30px rgba(0,150,255,0.5);}
</style>
</head>
<body>

<h1>Chaos & Dynamical Systems Lab</h1>

<div class="controls">
<label>σ: <input type="range" id="sigma" min="0" max="50" value="10" step="0.1"></label>
<label>ρ: <input type="range" id="rho" min="0" max="50" value="28" step="0.1"></label>
<label>β: <input type="range" id="beta" min="0" max="10" value="2.667" step="0.001"></label>
<label>r (Logistic map): <input type="range" id="r" min="0" max="4" value="3.8" step="0.01"></label>
<button onclick="startChaos()">Start</button>
<button onclick="stopChaos()">Stop</button>
<button onclick="resetChaos()">Reset</button>
</div>

<canvas id="canvas" width="900" height="600"></canvas>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const width=canvas.width, height=canvas.height;

let points=[];
let interval;
let angle=0;

function lorenzStep(p, sigma,rho,beta,dt){
  let dx = sigma*(p.y-p.x)*dt;
  let dy = (p.x*(rho - p.z)-p.y)*dt;
  let dz = (p.x*p.y - beta*p.z)*dt;
  return {x:p.x+dx, y:p.y+dy, z:p.z+dz};
}

function drawLorenz(){
  ctx.fillStyle='rgba(5,5,5,0.2)';
  ctx.fillRect(0,0,width,height);

  const sigma=parseFloat(document.getElementById('sigma').value);
  const rho=parseFloat(document.getElementById('rho').value);
  const beta=parseFloat(document.getElementById('beta').value);

  // Rotate and draw points
  ctx.beginPath();
  points.forEach(p=>{
    let x2d = (p.x*Math.cos(angle) - p.z*Math.sin(angle))*10 + width/2;
    let y2d = (p.y)*10 + height/2;
    ctx.lineTo(x2d,y2d);
  });
  ctx.strokeStyle='rgba(0,255,255,0.7)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  angle+=0.01;
}

function startChaos(){
  if(interval) clearInterval(interval);
  points=[];
  let p={x:0.1,y:0,z:0};
  interval=setInterval(()=>{
    const sigma=parseFloat(document.getElementById('sigma').value);
    const rho=parseFloat(document.getElementById('rho').value);
    const beta=parseFloat(document.getElementById('beta').value);

    for(let i=0;i<5;i++){
      p = lorenzStep(p,sigma,rho,beta,0.01);
      points.push({x:p.x,y:p.y,z:p.z});
    }
    drawLorenz();
  },20);
}

function stopChaos(){clearInterval(interval);}
function resetChaos(){
  clearInterval(interval);
  ctx.fillStyle='#050505';
  ctx.fillRect(0,0,width,height);
  points=[];
  angle=0;
}
</script>

</body>
</html>
